name: Site acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run accessibility and performance acceptance
        run: python3 scripts/audit_site.py
      - name: Verify public publication index
        run: python3 scripts/audit_publications.py
      - name: Ensure no private newsroom artifacts in Pages
        run: python3 scripts/audit_private_boundary.py
      - name: Test private boundary policy
        run: python3 -m unittest discover -s scripts -p 'test_audit_private_boundary.py' -q
