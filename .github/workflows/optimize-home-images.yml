name: Optimize homepage images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/optimize-home-images.yml"
      - "scripts/optimize_home_images.py"
      - "assets/Celestial-Archipelag-Map.png"
      - "assets/home-tiles/Monochrome Brutalist House Diorama.png"
      - "assets/home-tiles/Gritty Kolkata Signage Study.png"
      - "assets/home-tiles/Australian Flag Billowing in Blue Sky.png"
      - "assets/home-tiles/Warm Orange Storage Showroom.png"
      - "assets/home-tiles/What an Architectural Model Lets You See.png"
      - "assets/home-tiles/Urban-Typography-in-Grayscale-and-Red.png"
      - "assets/home-tiles/Moonlit-Noir-Canal-Town.png"
      - "assets/home-tiles/Cozy-fantasy-Longhouse-Shelves.png"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate optimized WebP assets
        run: python scripts/optimize_home_images.py

      - name: Commit optimized assets
        shell: bash
        run: |
          if git diff --quiet -- assets/optimized; then
            echo "Optimized assets are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/optimized
          git commit -m "Generate optimized homepage image assets"
          git push
